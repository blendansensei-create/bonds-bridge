<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doubles, Halves & Near Doubles Master</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .font-kids {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    @keyframes popIn {
      0% { transform: scale(0.65); opacity: 0; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .counter-cell {
      aspect-ratio: 1 / 1;
      border: 2px dashed rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .counter-circle {
      width: 84%;
      height: 84%;
      border-radius: 9999px;
      box-shadow: inset 0 -3px 5px rgba(0,0,0,0.35), 0 3px 6px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-2 sm:p-4 selection:bg-amber-400 selection:text-slate-900">

  <!-- TOP HEADER & PRIMARY NAVIGATION -->
  <header class="max-w-4xl w-full mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 pb-2 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-500 flex items-center justify-center font-kids font-bold text-slate-950 text-xl shadow-lg">
        2×
      </div>
      <div>
        <h1 class="font-kids text-xl sm:text-2xl font-bold tracking-wide text-indigo-400">Doubles, Halves & Near Doubles</h1>
        <p class="text-xs text-slate-400">Fluency Warm-Up • Numbers 1–20 & 21–100 • NI Curriculum</p>
      </div>
    </div>

    <!-- PRIMARY MODES SELECTOR -->
    <nav class="flex items-center bg-slate-800/90 p-1 rounded-xl border border-slate-700 text-xs sm:text-sm font-semibold flex-wrap gap-1">
      <button id="navModeDoubles" onclick="switchMainMode('doubles')" class="px-3 py-1.5 rounded-lg transition-all bg-indigo-500 text-white shadow font-bold">
        1. Doubles
      </button>
      <button id="navModeHalves" onclick="switchMainMode('halves')" class="px-3 py-1.5 rounded-lg transition-all text-slate-300 hover:text-white">
        2. Halves
      </button>
      <button id="navModeNear" onclick="switchMainMode('near')" class="px-3 py-1.5 rounded-lg transition-all text-slate-300 hover:text-white">
        3. Near Doubles
      </button>
      <button id="navModeRush" onclick="switchMainMode('rush')" class="px-3 py-1.5 rounded-lg transition-all text-slate-300 hover:text-white">
        4. 60s Rush
      </button>
    </nav>
  </header>

  <!-- SUB-BAR: TARGET SELECTION, RANGE & CHALLENGE TOGGLE -->
  <section class="max-w-4xl w-full mx-auto my-2 flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm bg-slate-800/50 p-2.5 rounded-xl border border-slate-800">
    
    <!-- Range Selector -->
    <div class="flex items-center gap-1.5 flex-wrap">
      <span class="text-slate-400 text-xs font-medium mr-1">Number Range:</span>
      <button id="rangeBtn20" onclick="setNumberRange('20')" class="px-3 py-1 rounded-md text-xs font-bold bg-indigo-500 text-white shadow">1 – 20</button>
      <button id="rangeBtn100" onclick="setNumberRange('100')" class="px-3 py-1 rounded-md text-xs font-bold bg-slate-700 hover:bg-slate-600 text-white">21 – 100</button>
      
      <!-- Near Halves Extension Challenge Toggle (Only visible in Halves mode) -->
      <button id="nearHalvesChallengeBtn" onclick="toggleNearHalvesChallenge()" class="hidden ml-2 px-3 py-1 rounded-md text-xs font-bold border border-amber-400/60 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition-all flex items-center gap-1">
        <span>⚡ Near Halves (Odd Numbers)</span>
        <span id="challengeBadge" class="bg-slate-800 px-1.5 py-0.2 rounded text-[10px] text-slate-300">OFF</span>
      </button>
    </div>

    <!-- Live Metrics -->
    <div class="flex items-center gap-4 font-kids ml-auto">
      <div class="flex items-center gap-1.5 text-amber-400 font-bold">
        <span>Streak:</span>
        <span id="streakCount">🔥 0</span>
      </div>
      <div class="flex items-center gap-1.5 text-emerald-400 font-bold">
        <span>Score:</span>
        <span id="scoreDisplay">0</span>
      </div>
      <div id="timerContainer" class="hidden flex items-center gap-1 text-rose-400 font-bold">
        <span>⏱️</span>
        <span id="timeRemaining">60s</span>
      </div>
    </div>
  </section>

  <!-- MAIN INTERACTIVE STAGE -->
  <main class="max-w-3xl w-full mx-auto bg-slate-800/80 rounded-2xl border border-slate-700/80 shadow-2xl p-4 sm:p-6 flex flex-col items-center justify-between gap-4 flex-grow my-1 relative overflow-hidden">
    
    <!-- QUESTION DISPLAY PANEL -->
    <div class="w-full flex flex-col items-center">
      <div id="equationBox" class="bg-slate-900/90 border-2 border-slate-700 px-8 py-3 rounded-2xl flex items-center justify-center gap-3 font-kids text-5xl sm:text-6xl font-bold tracking-wider shadow-inner text-amber-300 min-h-[85px]">
        <!-- Math question -->
      </div>
      
      <!-- Pedagogical Hint Prompt -->
      <div id="promptGuidance" class="mt-2 text-base sm:text-lg font-semibold text-slate-200 text-center min-h-[26px]">
        Double 8 is the same as 8 + 8!
      </div>
    </div>

    <!-- DYNAMIC VISUAL CONTAINER - ENLARGED -->
    <div id="visualDisplayArea" class="w-full bg-slate-900/70 border border-slate-700/70 rounded-xl p-4 sm:p-6 flex items-center justify-center min-h-[220px]">
      <!-- Visuals injected here (Mirror Arrays, Partition Bars, Split Halving Blocks) -->
    </div>

    <!-- INPUT & NUMPAD CONTROLS -->
    <div class="w-full max-w-md flex flex-col items-center gap-2">
      <!-- Input Display Screen -->
      <div class="w-full flex items-center justify-between gap-3">
        <div id="activeInputScreen" class="flex-grow h-15 py-2 bg-slate-950 border-2 border-amber-400/80 rounded-xl flex items-center justify-center font-kids text-4xl font-bold text-amber-400 shadow-inner tracking-widest">
          ?
        </div>
        <button onclick="clearCurrentInput()" class="px-5 h-15 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-bold text-slate-200 uppercase tracking-wider active:scale-95 transition-all">
          Clear
        </button>
      </div>

      <!-- Quick Numpad Grid (With .5 quick key for Near Halves) -->
      <div class="grid grid-cols-11 gap-1.5 w-full">
        <button onclick="pressDigit('1')" class="h-12 bg-slate-700/90 hover:bg-slate-600 text-white font-kids font-bold text-xl rounded-lg shadow active:scale-95 transition-all">1</button>
        <button onclick="pressDigit('2')" class="h-12 bg-slate-700/90 hover:bg-slate-600 text-white font-kids font-bold text-xl rounded-lg shadow active:scale-95 transition-all">2</button>
        <button onclick="pressDigit('3')" class="h-12 bg-slate-700/90 hover:bg-slate-600 text-white font-kids font-bold text-xl rounded-lg shadow active:scale-95 transition-all">3</button>
        <button onclick="pressDigit('4')" class="h-12 bg-slate-700/90 hover:bg-slate-600 text-white font-kids font-bold text-xl rounded-lg shadow active:scale-95 transition-all">4</button>
        <button onclick="pressDigit('5')" class="h-12 bg-slate-700/90 hover:bg-slate-600 text-white font-kids font-bold text-xl rounded-lg shadow active:scale-95 transition-all">5</button>
        <button onclick="pressDigit('6')" class="h-12 bg-slate-700/90 hover:bg-slate-600 text-white font-kids font-bold text-xl rounded-lg shadow active:scale-95 transition-all">6</button>
        <button onclick="pressDigit('7')" class="h-12 bg-slate-700/90 hover:bg-slate-600 text-white font-kids font-bold text-xl rounded-lg shadow active:scale-95 transition-all">7</button>
        <button onclick="pressDigit('8')" class="h-12 bg-slate-700/90 hover:bg-slate-600 text-white font-kids font-bold text-xl rounded-lg shadow active:scale-95 transition-all">8</button>
        <button onclick="pressDigit('9')" class="h-12 bg-slate-700/90 hover:bg-slate-600 text-white font-kids font-bold text-xl rounded-lg shadow active:scale-95 transition-all">9</button>
        <button onclick="pressDigit('0')" class="h-12 bg-slate-700/90 hover:bg-slate-600 text-white font-kids font-bold text-xl rounded-lg shadow active:scale-95 transition-all">0</button>
        <button id="halfKey" onclick="pressDigit('.5')" class="h-12 bg-amber-600 hover:bg-amber-500 text-white font-kids font-bold text-sm sm:text-base rounded-lg shadow active:scale-95 transition-all">.5</button>
      </div>

      <!-- Action Button -->
      <button id="submitActionBtn" onclick="submitCurrentAnswer()" class="w-full h-14 py-3 mt-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 font-kids text-2xl font-bold text-slate-950 rounded-xl shadow-lg active:scale-98 transition-all flex items-center justify-center gap-2">
        <span>Check Answer</span>
        <span>✨</span>
      </button>
    </div>

    <!-- FEEDBACK BANNER -->
    <div id="feedbackBox" class="w-full text-center text-base sm:text-lg font-bold min-h-[26px] transition-all"></div>
  </main>

  <footer class="max-w-4xl w-full mx-auto text-center text-xs text-slate-500 pt-1">
    Interactive Whiteboard & Tablet Friendly • Tap on-screen keypad or press 0-9, .5 & Enter on keyboard
  </footer>

  <!-- CORE SCRIPT -->
  <script>
    /* =====================================================================
       WEB AUDIO SYNTHESIZER
       ===================================================================== */
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'correct') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.07);
            gain.gain.setValueAtTime(0.25, now + i * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.07);
            osc.stop(now + i * 0.07 + 0.36);
          });
        } else if (type === 'tryAgain') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.25);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        }
      } catch (e) {
        console.warn('Audio play error:', e);
      }
    }

    /* =====================================================================
       STATE MANAGEMENT
       ===================================================================== */
    let currentMode = 'doubles'; // 'doubles', 'halves', 'near', 'rush'
    let currentRange = '20';     // '20' or '100'
    let nearHalvesEnabled = false; // Challenge toggle

    let currentInput = '';
    let streak = 0;
    let score = 0;
    let questionData = {};
    let isProcessing = false;

    let timerInterval = null;
    let rushTimeLeft = 60;

    window.addEventListener('DOMContentLoaded', () => {
      generateQuestion();
      setupKeyboardListeners();
    });

    function switchMainMode(mode) {
      playSound('pop');
      currentMode = mode;
      
      document.querySelectorAll('header nav button').forEach(b => {
        b.className = 'px-3 py-1.5 rounded-lg transition-all text-slate-300 hover:text-white';
      });

      const nearHalvesBtn = document.getElementById('nearHalvesChallengeBtn');
      if (mode === 'doubles') {
        document.getElementById('navModeDoubles').className = 'px-3 py-1.5 rounded-lg transition-all bg-indigo-500 text-white shadow font-bold';
        nearHalvesBtn.classList.add('hidden');
        document.getElementById('timerContainer').classList.add('hidden');
        clearInterval(timerInterval);
      } else if (mode === 'halves') {
        document.getElementById('navModeHalves').className = 'px-3 py-1.5 rounded-lg transition-all bg-indigo-500 text-white shadow font-bold';
        nearHalvesBtn.classList.remove('hidden');
        document.getElementById('timerContainer').classList.add('hidden');
        clearInterval(timerInterval);
      } else if (mode === 'near') {
        document.getElementById('navModeNear').className = 'px-3 py-1.5 rounded-lg transition-all bg-indigo-500 text-white shadow font-bold';
        nearHalvesBtn.classList.add('hidden');
        document.getElementById('timerContainer').classList.add('hidden');
        clearInterval(timerInterval);
      } else if (mode === 'rush') {
        document.getElementById('navModeRush').className = 'px-3 py-1.5 rounded-lg transition-all bg-indigo-500 text-white shadow font-bold';
        nearHalvesBtn.classList.add('hidden');
        document.getElementById('timerContainer').classList.remove('hidden');
        startRushTimer();
      }

      streak = 0;
      updateMetrics();
      generateQuestion();
    }

    function setNumberRange(range) {
      playSound('pop');
      currentRange = range;
      if (range === '20') {
        document.getElementById('rangeBtn20').className = 'px-3 py-1 rounded-md text-xs font-bold bg-indigo-500 text-white shadow';
        document.getElementById('rangeBtn100').className = 'px-3 py-1 rounded-md text-xs font-bold bg-slate-700 hover:bg-slate-600 text-white';
      } else {
        document.getElementById('rangeBtn20').className = 'px-3 py-1 rounded-md text-xs font-bold bg-slate-700 hover:bg-slate-600 text-white';
        document.getElementById('rangeBtn100').className = 'px-3 py-1 rounded-md text-xs font-bold bg-indigo-500 text-white shadow';
      }
      generateQuestion();
    }

    function toggleNearHalvesChallenge() {
      playSound('pop');
      nearHalvesEnabled = !nearHalvesEnabled;
      const badge = document.getElementById('challengeBadge');
      const btn = document.getElementById('nearHalvesChallengeBtn');

      if (nearHalvesEnabled) {
        badge.textContent = 'ON';
        badge.className = 'bg-amber-400 px-1.5 py-0.2 rounded text-[10px] text-slate-950 font-bold';
        btn.className = 'ml-2 px-3 py-1 rounded-md text-xs font-bold border border-amber-400 bg-amber-500/30 text-amber-300 shadow transition-all flex items-center gap-1';
      } else {
        badge.textContent = 'OFF';
        badge.className = 'bg-slate-800 px-1.5 py-0.2 rounded text-[10px] text-slate-300';
        btn.className = 'ml-2 px-3 py-1 rounded-md text-xs font-bold border border-amber-400/60 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition-all flex items-center gap-1';
      }
      generateQuestion();
    }

    /* =====================================================================
       QUESTION GENERATION
       ===================================================================== */
    function generateQuestion() {
      clearCurrentInput();
      clearFeedback();

      if (currentMode === 'doubles') {
        let n;
        if (currentRange === '20') {
          n = Math.floor(Math.random() * 20) + 1; // 1 to 20
        } else {
          n = Math.floor(Math.random() * 80) + 21; // 21 to 100
        }
        questionData = {
          type: 'double',
          base: n,
          answer: n * 2
        };
        renderDoublesUI();
      } else if (currentMode === 'halves') {
        let whole;
        let isOdd = nearHalvesEnabled;

        if (currentRange === '20') {
          if (isOdd) {
            // Odd numbers 3 to 19
            const odds = [3, 5, 7, 9, 11, 13, 15, 17, 19];
            whole = odds[Math.floor(Math.random() * odds.length)];
          } else {
            // Even numbers 2 to 20
            whole = (Math.floor(Math.random() * 10) + 1) * 2;
          }
        } else {
          if (isOdd) {
            // Odd numbers 21 to 99
            whole = (Math.floor(Math.random() * 40) + 10) * 2 + 1;
          } else {
            // Even numbers 22 to 100
            whole = (Math.floor(Math.random() * 40) + 11) * 2;
          }
        }

        questionData = {
          type: 'half',
          whole: whole,
          isOdd: isOdd,
          answer: whole / 2
        };
        renderHalvesUI();
      } else if (currentMode === 'near') {
        let n;
        if (currentRange === '20') {
          n = Math.floor(Math.random() * 19) + 1; // 1 to 19 (e.g. 7 + 8)
        } else {
          n = Math.floor(Math.random() * 70) + 20; // 20 to 89
        }
        questionData = {
          type: 'near',
          base: n,
          addend2: n + 1,
          answer: n + (n + 1)
        };
        renderNearUI();
      } else if (currentMode === 'rush') {
        // Fast fire mix
        const pick = Math.random();
        if (pick < 0.35) {
          const n = Math.floor(Math.random() * 15) + 1;
          questionData = { type: 'double', base: n, answer: n * 2 };
          renderDoublesUI();
        } else if (pick < 0.7) {
          const whole = (Math.floor(Math.random() * 10) + 1) * 2;
          questionData = { type: 'half', whole: whole, isOdd: false, answer: whole / 2 };
          renderHalvesUI();
        } else {
          const n = Math.floor(Math.random() * 12) + 1;
          questionData = { type: 'near', base: n, addend2: n + 1, answer: n + (n + 1) };
          renderNearUI();
        }
      }

      renderVisualizer();
    }

    /* =====================================================================
       UI RENDERING
       ===================================================================== */
    function renderDoublesUI() {
      const eq = document.getElementById('equationBox');
      eq.innerHTML = `
        <span class="text-indigo-400">Double</span>
        <span class="text-amber-300 font-bold">${questionData.base}</span>
        <span class="text-slate-400">=</span>
        <span class="text-emerald-400 underline decoration-dashed">?</span>
      `;
      document.getElementById('promptGuidance').innerHTML = 
        `Double <span class="text-amber-400 font-bold">${questionData.base}</span> is the same as <span class="text-indigo-300">${questionData.base} + ${questionData.base}</span>!`;
    }

    function renderHalvesUI() {
      const eq = document.getElementById('equationBox');
      const q = questionData;
      eq.innerHTML = `
        <span class="text-indigo-400">Half of</span>
        <span class="text-amber-300 font-bold">${q.whole}</span>
        <span class="text-slate-400">=</span>
        <span class="text-emerald-400 underline decoration-dashed">?</span>
      `;
      if (q.isOdd) {
        const nearestEven = q.whole - 1;
        document.getElementById('promptGuidance').innerHTML = 
          `⚡ Near Half Challenge: Nearest even is <span class="text-amber-400 font-bold">${nearestEven}</span> (Half is ${nearestEven / 2}) + <span class="text-amber-300">0.5</span>!`;
      } else {
        document.getElementById('promptGuidance').innerHTML = 
          `Split <span class="text-amber-400 font-bold">${q.whole}</span> equally into two balanced parts!`;
      }
    }

    function renderNearUI() {
      const eq = document.getElementById('equationBox');
      const q = questionData;
      eq.innerHTML = `
        <span class="text-blue-400">${q.base}</span>
        <span class="text-slate-400">+</span>
        <span class="text-indigo-400">${q.addend2}</span>
        <span class="text-slate-400">=</span>
        <span class="text-emerald-400 underline decoration-dashed">?</span>
      `;
      document.getElementById('promptGuidance').innerHTML = 
        `Near Double: <span class="text-amber-300 font-bold">Double ${q.base}</span> (<span class="text-indigo-300">${q.base * 2}</span>) plus <span class="text-amber-400 font-bold">1 more</span>!`;
    }

    /* =====================================================================
       DYNAMIC VISUALIZERS
       ===================================================================== */
    function renderVisualizer() {
      const container = document.getElementById('visualDisplayArea');
      container.innerHTML = '';

      if (questionData.type === 'double') {
        if (questionData.base <= 12) {
          container.innerHTML = renderTwinDotsArray(questionData.base, questionData.base, false);
        } else {
          container.innerHTML = renderPartitionDoubleBar(questionData.base);
        }
      } else if (questionData.type === 'half') {
        if (questionData.whole <= 24) {
          container.innerHTML = renderHalvingArray(questionData.whole, questionData.isOdd);
        } else {
          container.innerHTML = renderPartitionHalfBar(questionData.whole, questionData.isOdd);
        }
      } else if (questionData.type === 'near') {
        if (questionData.base <= 12) {
          container.innerHTML = renderTwinDotsArray(questionData.base, questionData.addend2, true);
        } else {
          container.innerHTML = renderPartitionNearDoubleBar(questionData.base);
        }
      }
    }

    // Mirror Twin-Array Visualizer
    function renderTwinDotsArray(count1, count2, isNearDouble) {
      function makeDots(n, color) {
        let dots = '';
        for (let i = 0; i < n; i++) {
          dots += `<div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full ${color} shadow-md animate-pop"></div>`;
        }
        return dots;
      }

      return `
        <div class="flex items-center gap-6 justify-center flex-wrap">
          <div class="flex flex-col items-center">
            <span class="text-xs font-kids text-slate-300 mb-1">Set 1 (${count1})</span>
            <div class="grid grid-cols-5 gap-2 bg-slate-950 p-3 rounded-2xl border border-slate-700 min-h-[70px]">
              ${makeDots(count1, 'bg-indigo-400')}
            </div>
          </div>
          <div class="text-2xl font-kids text-slate-500 font-bold">+</div>
          <div class="flex flex-col items-center">
            <span class="text-xs font-kids text-slate-300 mb-1">Set 2 (${count2})</span>
            <div class="grid grid-cols-5 gap-2 bg-slate-950 p-3 rounded-2xl border border-slate-700 min-h-[70px]">
              ${makeDots(count1, 'bg-indigo-400')}
              ${isNearDouble ? '<div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-amber-400 ring-2 ring-amber-300 shadow-lg animate-bounce" title="+1 Extra"></div>' : ''}
            </div>
          </div>
        </div>
      `;
    }

    // Halving Array Visualizer with Odd Leftover handling
    function renderHalvingArray(whole, isOdd) {
      const halfFloor = Math.floor(whole / 2);
      function makeDots(n) {
        let dots = '';
        for (let i = 0; i < n; i++) {
          dots += `<div class="w-8 h-8 rounded-full bg-teal-400 shadow animate-pop"></div>`;
        }
        return dots;
      }

      return `
        <div class="flex flex-col items-center gap-3">
          <div class="text-xs font-kids text-slate-300">Splitting ${whole} down the middle:</div>
          <div class="flex items-center gap-4 justify-center flex-wrap">
            <div class="flex flex-col items-center bg-slate-950 p-3 rounded-2xl border border-slate-700">
              <span class="text-xs font-kids text-emerald-400 mb-1">${halfFloor}</span>
              <div class="grid grid-cols-4 gap-1.5">${makeDots(halfFloor)}</div>
            </div>
            ${isOdd ? `
              <div class="flex flex-col items-center bg-amber-500/20 p-2.5 rounded-2xl border border-amber-400/80">
                <span class="text-xs font-kids text-amber-300 mb-1">+0.5 leftover</span>
                <div class="w-8 h-8 rounded-full bg-amber-400 shadow-lg animate-pulse ring-2 ring-amber-300"></div>
              </div>` : '<div class="text-2xl font-bold text-slate-600 font-kids">|</div>'}
            <div class="flex flex-col items-center bg-slate-950 p-3 rounded-2xl border border-slate-700">
              <span class="text-xs font-kids text-emerald-400 mb-1">${halfFloor}</span>
              <div class="grid grid-cols-4 gap-1.5">${makeDots(halfFloor)}</div>
            </div>
          </div>
        </div>
      `;
    }

    // Partition Bar Model for 2-Digit Doubles
    function renderPartitionDoubleBar(n) {
      const tens = Math.floor(n / 10) * 10;
      const units = n % 10;

      return `
        <div class="flex flex-col items-center gap-3 w-full max-w-md">
          <div class="text-xs font-kids text-slate-300">Partition into Tens & Units:</div>
          <div class="grid grid-cols-2 gap-3 w-full">
            <div class="bg-slate-950 p-3 rounded-xl border border-indigo-500/40 text-center">
              <div class="text-xs text-slate-400">Tens: Double ${tens}</div>
              <div class="text-2xl font-bold font-kids text-indigo-400 mt-1">${tens * 2}</div>
            </div>
            <div class="bg-slate-950 p-3 rounded-xl border border-amber-500/40 text-center">
              <div class="text-xs text-slate-400">Units: Double ${units}</div>
              <div class="text-2xl font-bold font-kids text-amber-400 mt-1">${units * 2}</div>
            </div>
          </div>
          <div class="text-xs font-kids text-emerald-400">Combine: ${tens * 2} + ${units * 2} = ${n * 2}</div>
        </div>
      `;
    }

    // Partition Bar Model for 2-Digit Halves (Handles Odd Tens/Units)
    function renderPartitionHalfBar(whole, isOdd) {
      const half = whole / 2;
      return `
        <div class="flex flex-col items-center gap-3 w-full max-w-md">
          <div class="text-xs font-kids text-slate-300">Friendly Halving Partition:</div>
          <div class="w-full bg-slate-950 p-4 rounded-xl border border-slate-700 text-center flex justify-around items-center">
            <div>
              <span class="text-xs text-slate-400">Total Whole</span>
              <div class="text-3xl font-bold font-kids text-amber-300">${whole}</div>
            </div>
            <div class="text-2xl text-slate-600">➔</div>
            <div>
              <span class="text-xs text-emerald-400">Each Equal Half</span>
              <div class="text-3xl font-bold font-kids text-emerald-400">${half}</div>
            </div>
          </div>
        </div>
      `;
    }

    // Partition Bar for Near Doubles
    function renderPartitionNearDoubleBar(n) {
      const dbl = n * 2;
      return `
        <div class="flex flex-col items-center gap-2 w-full max-w-md">
          <div class="text-xs font-kids text-slate-300">Strategy: Double base + 1</div>
          <div class="flex items-center gap-2 w-full justify-center">
            <div class="bg-slate-950 px-4 py-2 rounded-xl border border-indigo-500/50 text-center">
              <div class="text-xs text-slate-400">Double ${n}</div>
              <div class="text-xl font-bold font-kids text-indigo-400">${dbl}</div>
            </div>
            <div class="text-xl font-bold text-slate-500 font-kids">+</div>
            <div class="bg-slate-950 px-4 py-2 rounded-xl border border-amber-500/50 text-center">
              <div class="text-xs text-amber-400">Extra</div>
              <div class="text-xl font-bold font-kids text-amber-400">1</div>
            </div>
          </div>
        </div>
      `;
    }

    /* =====================================================================
       INPUT & EVALUATION
       ===================================================================== */
    function pressDigit(val) {
      if (isProcessing) return;
      playSound('pop');
      if (currentInput.length < 5) {
        currentInput += val;
        updateInputScreen();
      }
    }

    function clearCurrentInput() {
      currentInput = '';
      updateInputScreen();
    }

    function updateInputScreen() {
      const screen = document.getElementById('activeInputScreen');
      screen.textContent = currentInput === '' ? '?' : currentInput;
    }

    function submitCurrentAnswer() {
      if (isProcessing || currentInput === '') return;
      const userVal = parseFloat(currentInput);

      if (Math.abs(userVal - questionData.answer) < 0.01) {
        handleSuccess(`⭐ Perfect! That's correct!`);
      } else {
        handleMistake(`Not quite. Have another go!`);
      }
    }

    function handleSuccess(msg) {
      isProcessing = true;
      playSound('correct');
      streak++;
      score += 10;
      updateMetrics();
      flashFeedback(msg, true);

      setTimeout(() => {
        isProcessing = false;
        generateQuestion();
      }, 1200);
    }

    function handleMistake(msg) {
      playSound('tryAgain');
      streak = 0;
      updateMetrics();
      flashFeedback(msg, false);
      clearCurrentInput();
    }

    function flashFeedback(msg, isSuccess) {
      const fb = document.getElementById('feedbackBox');
      fb.textContent = msg;
      fb.className = `w-full text-center text-base sm:text-lg font-bold min-h-[26px] transition-all ${
        isSuccess ? 'text-emerald-400 animate-pop' : 'text-rose-400'
      }`;
    }

    function clearFeedback() {
      const fb = document.getElementById('feedbackBox');
      fb.textContent = '';
    }

    function updateMetrics() {
      document.getElementById('streakCount').textContent = `🔥 ${streak}`;
      document.getElementById('scoreDisplay').textContent = score;
    }

    /* =====================================================================
       RUSH MODE TIMER
       ===================================================================== */
    function startRushTimer() {
      clearInterval(timerInterval);
      rushTimeLeft = 60;
      document.getElementById('timeRemaining').textContent = `${rushTimeLeft}s`;

      timerInterval = setInterval(() => {
        rushTimeLeft--;
        document.getElementById('timeRemaining').textContent = `${rushTimeLeft}s`;
        if (rushTimeLeft <= 0) {
          clearInterval(timerInterval);
          alert(`⏰ Time's up!\nFinal Score: ${score}`);
          switchMainMode('doubles');
        }
      }, 1000);
    }

    /* =====================================================================
       KEYBOARD SHORTCUTS
       ===================================================================== */
    function setupKeyboardListeners() {
      window.addEventListener('keydown', (e) => {
        if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
          pressDigit(e.key);
        } else if (e.key === 'Enter') {
          submitCurrentAnswer();
        } else if (e.key === 'Backspace' || e.key === 'Escape') {
          clearCurrentInput();
        }
      });
    }
  </script>
</body>
</html>
